<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="845" viewBox="0 0 1250 845"><title>Flush does not clear memory or commit batches — HOW THE PROBLEM HAPPENS</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="black"/></marker></defs>
<text x="625" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="black">Flush does not clear memory or commit batches</text>
<text x="625" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="black">HOW THE PROBLEM HAPPENS</text>
<rect x="45" y="160" width="1160" height="110" fill="white" stroke="black" stroke-width="2"/>
<text x="625" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="black">1. Import loads many rows and creates managed entities</text>
<path d="M625 270 V306" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="315" width="1160" height="110" fill="white" stroke="black" stroke-width="2"/>
<text x="625" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="black">2. flush sends SQL but retains managed objects</text>
<path d="M625 425 V461" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="470" width="1160" height="110" fill="white" stroke="black" stroke-width="2"/>
<text x="625" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="black">3. Persistence context and transaction grow</text>
<path d="M625 580 V616" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="625" width="1160" height="110" fill="white" stroke="black" stroke-width="2"/>
<text x="625" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="black">4. Heap, dirty checking, locks and rollback costs increase</text>
<text x="625" y="820" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="black">Illustrative sequence; execution evidence is recorded separately.</text>
</svg>