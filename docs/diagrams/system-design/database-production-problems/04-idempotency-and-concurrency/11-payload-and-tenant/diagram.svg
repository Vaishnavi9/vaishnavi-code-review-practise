<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="845" viewBox="0 0 1250 845"><title>Same idempotency key, different intent — HOW THE PROBLEM HAPPENS</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="black"/></marker></defs>
<text x="625" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="black">Same idempotency key, different intent</text>
<text x="625" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="black">HOW THE PROBLEM HAPPENS</text>
<rect x="45" y="160" width="1160" height="110" fill="white" stroke="black" stroke-width="2"/>
<text x="625" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="black">1. Key K belongs to merchant A and amount 100</text>
<path d="M625 270 V306" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="315" width="1160" height="110" fill="white" stroke="black" stroke-width="2"/>
<text x="625" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="black">2. Caller sends K with amount 900, or another merchant</text>
<path d="M625 425 V461" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="470" width="1160" height="110" fill="white" stroke="black" stroke-width="2"/>
<text x="625" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="black">3. Lookup uses only K and blindly replays</text>
<path d="M625 580 V616" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="625" width="1160" height="110" fill="white" stroke="black" stroke-width="2"/>
<text x="625" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="black">4. Response refers to wrong intent or leaks another merchant’s data</text>
<text x="625" y="820" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="black">Illustrative sequence; execution evidence is recorded separately.</text>
</svg>