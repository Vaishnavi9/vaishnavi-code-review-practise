<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Load balancer: one entrance, several application instances</title><desc id="desc">Clients send requests to a load balancer. Each request is forwarded to one eligible application instance. The load balancer does not itself create more application instances.</desc>
<rect width="1200" height="920" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker></defs>
<text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="black">LOAD BALANCER</text>
<text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="black">Like a helper directing shoppers to open checkout counters</text>
<rect x="400" y="145" width="400" height="110" rx="6" fill="white" stroke="black" stroke-width="2"/>
<text x="600.0" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="black">Clients</text>
<text x="600.0" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="black">Browser or merchant backend</text>
<path d="M600 255 L600 335" stroke="black" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="790" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="black">Incoming requests</text>
<rect x="380" y="345" width="440" height="120" rx="6" fill="white" stroke="black" stroke-width="2"/>
<text x="600.0" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="black">Load balancer</text>
<text x="600.0" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="black">One public entrance</text>
<text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="black">For each request, choose ONE eligible instance</text>
<path d="M470 465 L470 545 L205 545 L205 605" stroke="black" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M600 525 L600 605" stroke="black" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M730 465 L730 545 L995 545 L995 605" stroke="black" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="45" y="615" width="320" height="120" rx="6" fill="white" stroke="black" stroke-width="2"/>
<text x="205.0" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="black">Application instance A</text>
<text x="205.0" y="691" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="black">Same payment application</text>
<rect x="440" y="615" width="320" height="120" rx="6" fill="white" stroke="black" stroke-width="2"/>
<text x="600.0" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="black">Application instance B</text>
<text x="600.0" y="691" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="black">Same payment application</text>
<rect x="835" y="615" width="320" height="120" rx="6" fill="white" stroke="black" stroke-width="2"/>
<text x="995.0" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="black">Application instance C</text>
<text x="995.0" y="691" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="black">Same payment application</text>
<text x="600" y="787" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="black">The response returns through the load balancer to the client.</text>
<text x="600" y="838" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="black">More app instances are created by a separate scaling mechanism.</text>
<text x="600" y="883" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="black">Conceptual request flow. Branches mean alternatives, not a broadcast.</text>
</svg>