<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="809" viewBox="0 0 1760 809"><title>provider_inbox_events schema and foreign keys</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs>
<text x="40" y="50" fill="black" font-family="Arial,sans-serif" font-size="32" font-weight="bold">paymesh.provider_inbox_events</text>
<text x="40" y="90" fill="black" font-family="Arial,sans-serif" font-size="24" font-weight="normal">FK arrow: child columns → referenced parent key. Only declared constraints.</text>
<rect x="40" y="130" width="770" height="619" fill="white" stroke="black" stroke-width="2"/>
<text x="60" y="169" fill="black" font-family="Arial,sans-serif" font-size="24" font-weight="bold">Column | SQL type | key | nullability</text>
<text x="60" y="213" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">inbox_event_id : uuid  PK NOT NULL</text>
<text x="60" y="256" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">merchant_provider_account_id : uuid  FK NOT NULL</text>
<text x="60" y="299" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">attempt_id : uuid  FK nullable</text>
<text x="60" y="342" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">deduplication_key : varchar(250)  NOT NULL</text>
<text x="60" y="385" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">event_type : varchar(100)  NOT NULL</text>
<text x="60" y="428" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">payload : jsonb  NOT NULL</text>
<text x="60" y="471" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">status : varchar(40)  NOT NULL</text>
<text x="60" y="514" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">processing_attempt_count : integer  NOT NULL</text>
<text x="60" y="557" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">last_error : text  nullable</text>
<text x="60" y="600" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">received_at : timestamptz  NOT NULL</text>
<text x="60" y="643" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">verified_at : timestamptz  NOT NULL</text>
<text x="60" y="686" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">processed_at : timestamptz  nullable</text>
<text x="60" y="729" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">next_attempt_at : timestamptz  nullable</text>
