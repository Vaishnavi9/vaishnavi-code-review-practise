<text x="835" y="162" fill="black" font-family="Arial,sans-serif" font-size="18" font-weight="normal">attempt_id</text>
<rect x="1125" y="140" width="595" height="112" fill="white" stroke="black" stroke-width="2"/>
<text x="1145" y="176" fill="black" font-family="Arial,sans-serif" font-size="26" font-weight="bold">provider_attempts</text>
<text x="1145" y="210" fill="black" font-family="Arial,sans-serif" font-size="22" font-weight="normal">key: attempt_id</text>
<text x="1145" y="238" fill="black" font-family="Arial,sans-serif" font-size="18" font-weight="normal">referenced table</text>
<path d="M810 345 H1110" fill="none" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<text x="835" y="312" fill="black" font-family="Arial,sans-serif" font-size="18" font-weight="normal">merchant_provider_account_id</text>
<rect x="1125" y="290" width="595" height="112" fill="white" stroke="black" stroke-width="2"/>
<text x="1145" y="326" fill="black" font-family="Arial,sans-serif" font-size="26" font-weight="bold">merchant_provider_accounts</text>
<text x="1145" y="360" fill="black" font-family="Arial,sans-serif" font-size="22" font-weight="normal">key: merchant_provider_account_id</text>
<text x="1145" y="388" fill="black" font-family="Arial,sans-serif" font-size="18" font-weight="normal">referenced table</text>
<text x="40" y="774" fill="black" font-family="Arial,sans-serif" font-size="22" font-weight="normal">PK = primary key; FK = foreign key. Constraints, defaults and indexes are in the separate reference.</text>
