<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="723" viewBox="0 0 1760 723"><title>payout_attempts schema and foreign keys</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="black"/></marker></defs>
<text x="40" y="50" fill="black" font-family="Arial,sans-serif" font-size="32" font-weight="bold">paymesh.payout_attempts</text>
<text x="40" y="90" fill="black" font-family="Arial,sans-serif" font-size="24" font-weight="normal">FK arrow: child columns → referenced parent key. Only declared constraints.</text>
<rect x="40" y="130" width="770" height="533" fill="white" stroke="black" stroke-width="2"/>
<text x="60" y="169" fill="black" font-family="Arial,sans-serif" font-size="24" font-weight="bold">Column | SQL type | key | nullability</text>
<text x="60" y="213" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">payout_attempt_id : uuid  PK NOT NULL</text>
<text x="60" y="256" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">payout_id : uuid  FK NOT NULL</text>
<text x="60" y="299" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">bank_account_id : uuid  FK NOT NULL</text>
<text x="60" y="342" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">attempt_number : integer  NOT NULL</text>
<text x="60" y="385" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">external_idempotency_key : varchar(200)  NOT NULL</text>
<text x="60" y="428" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">bank_reference : varchar(200)  nullable</text>
<text x="60" y="471" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">status : varchar(40)  NOT NULL</text>
<text x="60" y="514" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">error_code : varchar(100)  nullable</text>
<text x="60" y="557" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">started_at : timestamptz  NOT NULL</text>
<text x="60" y="600" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">last_checked_at : timestamptz  nullable</text>
<text x="60" y="643" fill="black" font-family="Arial,sans-serif" font-size="21" font-weight="normal">resolved_at : timestamptz  nullable</text>
<path d="M810 195 H1110" fill="none" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<text x="835" y="162" fill="black" font-family="Arial,sans-serif" font-size="18" font-weight="normal">bank_account_id</text>
<rect x="1125" y="140" width="595" height="112" fill="white" stroke="black" stroke-width="2"/>
<text x="1145" y="176" fill="black" font-family="Arial,sans-serif" font-size="26" font-weight="bold">bank_accounts</text>
<text x="1145" y="210" fill="black" font-family="Arial,sans-serif" font-size="22" font-weight="normal">key: bank_account_id</text>
<text x="1145" y="238" fill="black" font-family="Arial,sans-serif" font-size="18" font-weight="normal">referenced table</text>
<path d="M810 345 H1110" fill="none" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<text x="835" y="312" fill="black" font-family="Arial,sans-serif" font-size="18" font-weight="normal">payout_id</text>
<rect x="1125" y="290" width="595" height="112" fill="white" stroke="black" stroke-width="2"/>
<text x="1145" y="326" fill="black" font-family="Arial,sans-serif" font-size="26" font-weight="bold">payouts</text>
<text x="1145" y="360" fill="black" font-family="Arial,sans-serif" font-size="22" font-weight="normal">key: payout_id</text>
<text x="1145" y="388" fill="black" font-family="Arial,sans-serif" font-size="18" font-weight="normal">referenced table</text>
<text x="40" y="688" fill="black" font-family="Arial,sans-serif" font-size="22" font-weight="normal">PK = primary key; FK = foreign key. Constraints, defaults and indexes are in the separate reference.</text>
