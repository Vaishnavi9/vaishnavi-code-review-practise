<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">REQUIRES_NEW: an independent transaction</title>
<desc id="desc">This is a propagation choice, not a partial rollback mechanism. Do not split two writes that must be atomic across independent transactions.</desc>
<rect width="1200" height="950" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker></defs>
<text x="600" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="black">REQUIRES_NEW: an independent transaction</text>
<text x="600" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">This is a propagation choice, not a partial rollback mechanism</text>
<rect x="50" y="140" width="1100" height="125" rx="4" fill="white" stroke="black" stroke-width="2"/>
<text x="600" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="black">1. Outer transaction T1 is active</text>
<text x="600" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">Its database work remains uncommitted.</text>
<text x="600" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">The outer resources may remain held.</text>
<path d="M600 265 L600 291" stroke="black" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="50" y="300" width="1100" height="125" rx="4" fill="white" stroke="black" stroke-width="2"/>
<text x="600" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="black">2. Proxied inner call starts T2</text>
<text x="600" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">T1 is suspended; T2 is independent.</text>
<text x="600" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">Another database connection is normally needed.</text>
<path d="M600 425 L600 451" stroke="black" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="50" y="460" width="1100" height="125" rx="4" fill="white" stroke="black" stroke-width="2"/>
<text x="600" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="black">3. Inner T2 commits successfully</text>
<text x="600" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">After: T2&#x27;s work is committed.</text>
<text x="600" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">Outer T1 resumes with its work still pending.</text>
<path d="M600 585 L600 611" stroke="black" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="50" y="620" width="1100" height="125" rx="4" fill="white" stroke="black" stroke-width="2"/>
<text x="600" y="654" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="black">4. Outer T1 later rolls back</text>
<text x="600" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">After: T1&#x27;s changes are discarded.</text>
<text x="600" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="black">T2&#x27;s committed work remains.</text>
<text x="600" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="black">Do not split two writes that must be atomic across independent transactions.</text>
<text x="600" y="922" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="black">Conceptual teaching diagram. No execution times or tested outcomes are implied.</text>
</svg>